name: Build APK and Release
on:
  push:
    branches: [ master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/binamar.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/binamar.p12" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Photo Editor by binamar (build ${{ github.run_number }})
          files: app/build/outputs/apk/debug/*.apk
